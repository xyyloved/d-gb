.av.him{background:#8fb6e8}.av.her{background:#ff8fb8}

.msg.her{flex-direction:row-reverse}.msg.her .bub{background:#ffe1ee;border-color:#ffc9e0}

.msg.sys{justify-content:center}
.msg.sys .bub{background:#fff0f6;border:1px dashed #ffc6de;color:#b5688e;font-size:11px;max-width:100%}
.msg.inner .bub{background:transparent;border:0;color:#b06a8f;font-style:italic;font-size:12.5px;padding:2px}

<script>
window.onerror=function(m,s,l){toast('⚠️ 第'+l+'行：'+m);};

var MODE='random', HER={av:'晚'}, AUTO_SCROLL=true;
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick1(a){return a[Math.floor(Math.random()*a.length)];}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('on');},1500);}
function nearBottom(){var c=document.getElementById('chat');return (c.scrollHeight-c.scrollTop-c.clientHeight)<90;}
function scrollBottom(){var c=document.getElementById('chat');c.scrollTop=c.scrollHeight;}
function toggleScroll(){AUTO_SCROLL=!AUTO_SCROLL;toast(AUTO_SCROLL?'📜 智能滚动：在底部才跟着走':'📜 已关闭：全部手动滑');if(AUTO_SCROLL)scrollBottom();var j=document.getElementById('jumpBtn');if(j)j.style.display='none';}
function addMsg(type,text,av){
  var chat=document.getElementById('chat'),stick=AUTO_SCROLL&&nearBottom();
  var d=document.createElement('div');d.className='msg '+type;var a='';
  if(type==='him')a='<div class="av him">'+esc(av||'他')+'</div>';
  if(type==='her')a='<div class="av her">'+esc(av||HER.av)+'</div>';
  var b='<div class="bub">'+esc(text)+'</div>';
  d.innerHTML=(type==='her')?(b+a):(a+b);
  chat.appendChild(d);if(stick)scrollBottom();
}
function showOpts(list){
  var chat=document.getElementById('chat'),stick=AUTO_SCROLL&&nearBottom();
  var old=document.getElementById('optwrap');if(old)old.remove();
  var w=document.createElement('div');w.className='optwrap';w.id='optwrap';
  list.forEach(function(o){var b=document.createElement('button');b.className='opt';b.textContent=o.t;b.onclick=function(){pickOpt(o);};w.appendChild(b);});
  chat.appendChild(w);if(stick)scrollBottom();
}
function pickOpt(o){var w=document.getElementById('optwrap');if(w)w.remove();if(o.echo!==false)addMsg('her',o.t,HER.av);if(o.fn)o.fn();}
function panel(title,html){document.getElementById('panelBox').innerHTML='<h3>'+esc(title)+'</h3>'+html+'<button onclick="closePanel()">关闭</button>';document.getElementById('panel').classList.add('on');}
function closePanel(){document.getElementById('panel').classList.remove('on');}

function phase(){if(st.belly<=4)return 0;if(st.belly<=10)return 1;if(st.belly<=18)return 2;return 3;}
function situationLine(){
  var s=[];
  if(st.stam<25)s.push('他手一直在抖，耐力快见底了');
  else if(st.stam>70&&st.belly>8)s.push('他今天状态不错，还能再推一轮');
  if(st.belly>=18)s.push('肚皮绷得发亮，再往下就是极限');
  else if(st.belly>=11)s.push('腰线已经没了，肚子沉得往下坠');
  else if(st.belly>=5)s.push('小腹顶出一个圆润的弧，他自己试着按了一下');
  if(st.bladd>=80)s.push('膀胱憋满了，再不排就要出事');
  if(st.mouth>=90)s.push('上下两头都到顶了');
  if(st.holdOn)s.push('还堵着，一格都不许排');
  if(st.open>=60)s.push('公开度有点高了，随时可能被人撞见');
  if(st.dep>=80)s.push('他已经不太需要你说第二遍');
  else if(st.dep>=50)s.push('他开始主动把腰往你手心里送');
  if(st.quiet&&st.voice<40)s.push('声音忍耐快崩了，随时会漏出来');
  if(st.plug)s.push('塞子还堵着，里面的水一直在晃');
  if(st.task)s.push('任务还挂着：'+st.task.t);
  if(!s.length)s.push('房间很安静，谁都没先开口');
  return '· '+pick1(s);
}

function gain(ml){
  var L=LIQ[st.liq],S=SPD[st.speed];
  var real=ml||rand(rangeOf(M)[0],rangeOf(M)[1]);
  st.total+=real;st.lastGain=real;
  var add=Math.max(1,Math.round(real/250*L.bf*S.bf*gearBelly()));
  st.belly+=add;if(st.belly>st.maxBelly)st.maxBelly=st.belly;
  st.dep=Math.min(100,st.dep+Math.round(real/120*L.dep*S.dep));
  st.shame=Math.min(100,st.shame+2+S.shame);
  st.obey=Math.min(100,st.obey+1);
  st.stam-=Math.round(real/120*L.stam*S.stam*gearStam());
  st.gainCount++;
  addMsg('nar',real+' 毫升'+L.n+'（'+S.n+'）慢慢进去（姿势：'+POSE[st.poseIdx]+'）。'+bellyDesc(st.belly));
  if(st.bandLv)addMsg('nar','束腹带把水堵在里面，绷得他整个小腹发硬，肚皮上勒出一圈浅痕。');
  if(st.vib)addMsg('nar','按摩棒还在震。他每抖一下，肚子里的水就跟着晃一下。');
  if(L.pat>1.4)addMsg('nar','他的肠子绞了一下，整个人往前弓，闷哼压在喉咙里。');
  addMsg('him',reactionText(),M.n.charAt(0));
  if(st.quiet)voiceDrop(18+L.pat*6+(st.vib?8:0));
  addLog(real,add);checkTask();holdTick();
  if(st.stam<=0){addMsg('sys','⚠️ 他撑不住了，手撑着地一直在抖。');updateStatus();rest();return;}
  updateStatus();checkAch();
  if(st.gainCount%3===0)st.stage=Math.min(5,st.stage+1);
  maybeMale();rOpts();
}

    addMsg('sys','🎰 指针停下：'+(r==='press'?'按压':'注入'));

    if(r==='press'){st.stam-=Math.round(10*mult);st.shame=Math.min(100,st.shame+Math.round(5*mult));st.dep=Math.min(100,st.dep+Math.round(3*mult));addMsg('nar','你把手掌贴上去，从他腹部一侧开始，缓慢地、带着方向地推。\n里面的水被这一下推得整个涌向另一侧，他弓起来，发出一声压不住的闷哼。'+tag);addMsg('him',pick1(['「别按……别转……」「呃……里面有声音。」']),M.n.charAt(0));}
    else{var ml=Math.round(rand(200,400)*mult);st.belly+=Math.max(1,Math.round(ml/250*gearBelly()));st.total+=ml;if(st.belly>st.maxBelly)st.maxBelly=st.belly;st.shame=Math.min(100,st.shame+Math.round(5*mult));st.dep=Math.min(100,st.dep+Math.round(4*mult));addMsg('nar','你拧开阀。'+ml+' 毫升灌进去。'+tag+'\n'+bellyDesc(st.belly));addMsg('him',reactionText(),M.n.charAt(0));}
    if(st.stam<=0){st.stam=1;addMsg('sys','⚠️ 他撑不住了。');}
    if(st.wheel.bet!=='none'&&!hit){addMsg('nar','「押错了。」你说，「那还得再领一张。」');drawPunish(1);}
    holdTick();updateStatus();checkAch();maybeMale();rOpts();
  },900);
}

function packSave(){
  var fs=null;
  try{fs=JSON.parse(localStorage.getItem('snn_fixed_save_v1')||'null');}catch(e){}
  if(fs&&fs.logs&&fs.logs.length>5)fs.logs=fs.logs.slice(-5);
  return btoa(unescape(encodeURIComponent(JSON.stringify({v:1,M:(M&&st&&st.turn)?MALES.indexOf(M):0,st:st,ach:ACH,unlock:UNLOCK,f:fs?JSON.stringify(fs):null}))));
}
function applySave(t){
  t=(t||'').trim().replace(/\s/g,'');
  if(!t){toast('没内容');return;}
  try{
    var o=JSON.parse(decodeURIComponent(escape(atob(t))));
    if(o.st)localStorage.setItem('snn_random_save_v1',JSON.stringify({M:o.M||0,st:o.st,logList:[],chat:'<div class="msg sys"><div class="bub">📥 已导入存档，从当前状态继续</div></div>',ach:o.ach||{},unlock:o.unlock||{}}));
    if(o.f)localStorage.setItem('snn_fixed_save_v1',o.f);
    refreshStart();closePanel();toast('📥 导入成功，回开始界面点「继续」');
  }catch(e){toast('⚠️ 存档串不对');}
}
function copySave(){
  var s=packSave();
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(function(){toast('📋 已复制（'+s.length+' 字）· 粘去微信发给自己');},function(){showSaveBox(s);});}
  else showSaveBox(s);
}
function showSaveBox(s){panel('📋 存档串（长按全选复制）','<div class="row">粘到微信「文件传输助手」发给自己就行。</div><textarea readonly onclick="this.select()" style="width:100%;height:130px;font-size:11px;border:1px solid #ffdcea;border-radius:8px;padding:6px">'+s+'</textarea>');}
function pasteSave(){if(navigator.clipboard&&navigator.clipboard.readText){navigator.clipboard.readText().then(function(t){applySave(t);},function(){askSaveBox();});}else askSaveBox();}
function askSaveBox(){panel('📥 导入存档','<div class="row">在下面长按粘贴存档串。</div><textarea id="inBox" placeholder="长按这里粘贴…" style="width:100%;height:120px;font-size:11px;border:1px solid #ffdcea;border-radius:8px;padding:6px"></textarea><button onclick="applySave(document.getElementById(\'inBox\').value)">✅ 导入</button>');}

var GHK='snn_gh_token',GHID='snn_gh_gist',GHLAST='snn_gh_last';
function ghTk(){return (localStorage.getItem(GHK)||'').trim();}
function ghId(){return (localStorage.getItem(GHID)||'').trim();}
function cloudPanel(){
  var t=ghTk(),g=ghId(),last=localStorage.getItem(GHLAST);
  panel('☁️ 云存档 · GitHub Gist',
   '<div class="row">token：'+(t?'✅':'❌')+' ｜ gist：'+(g?'✅ '+g.slice(0,10)+'…':'❌ 还没上传过')+(last?('<br>上次：'+last):'')+'</div>'+
   '<textarea id="tkBox" placeholder="把 ghp_... 粘在这里（只存本机）" style="width:100%;height:56px;font-size:11px;border:1px solid #ffdcea;border-radius:8px;padding:6px">'+esc(t)+'</textarea>'+
   '<textarea id="gidBox" placeholder="gist ID（换手机时把旧机这串粘过来）" style="width:100%;height:44px;font-size:11px;border:1px solid #ffdcea;border-radius:8px;padding:6px;margin-top:6px">'+esc(g)+'</textarea>'+
   '<button onclick="saveCloudToken()">🔑 保存</button>'+
   '<button style="background:linear-gradient(135deg,#8fd3a8,#5fbf85)" onclick="cloudPush()">☁️ 上传</button>'+
   '<button style="background:linear-gradient(135deg,#8fb6e8,#6f9de0)" onclick="cloudPull()">⬇️ 下载</button>');
}
function saveCloudToken(){var t=document.getElementById('tkBox').value.trim(),g=document.getElementById('gidBox').value.trim();if(t)localStorage.setItem(GHK,t);if(g)localStorage.setItem(GHID,g);toast('🔑 已保存');cloudPanel();}
function cloudPush(){
  var t=ghTk(),g=ghId();if(!t){toast('先粘贴并保存 token');return;}
  var url=g?('https://api.github.com/gists/'+g):'https://api.github.com/gists';
  toast('☁️ 上传中…');
  fetch(url,{method:g?'PATCH':'POST',headers:{'Authorization':'token '+t,'Content-Type':'application/json','Accept':'application/vnd.github+json'},
    body:JSON.stringify({description:'四爱模拟器 云存档',public:false,files:{'snn_save.json':{content:packSave()}}})})
  .then(function(r){return r.json();}).then(function(j){
    if(j&&j.id){localStorage.setItem(GHID,j.id);localStorage.setItem(GHLAST,new Date().toLocaleString());toast('☁️ 上传成功');cloudPanel();}
    else toast('⚠️ 失败：'+((j&&j.message)||'检查 token 权限'));
  }).catch(function(){toast('⚠️ 网络错误');});
}
function cloudPull(){
  var t=ghTk(),g=ghId();if(!t||!g){toast('先填 token 和 gist ID');return;}
  toast('⬇️ 下载中…');
  fetch('https://api.github.com/gists/'+g+'?t='+Date.now(),{headers:{'Authorization':'token '+t,'Accept':'application/vnd.github+json'}})
  .then(function(r){return r.json();}).then(function(j){
    var f=j&&j.files&&j.files['snn_save.json'];if(!f){toast('云端没找到存档');return;}
    var gt=f.truncated?fetch(f.raw_url).then(function(r){return r.text();}):Promise.resolve(f.content);
    return gt.then(function(txt){localStorage.setItem(GHLAST,new Date().toLocaleString());applySave(txt);});
  }).catch(function(){toast('⚠️ 网络错误或 token 失效');});
}

/* ===== 固定线 沈屿·林晚 ===== */
var FS={node:'n1',dep:0,shame:0,own:0,obey:0,belly:0,total:0,logs:[]};
var FROLE={'n1':'医学院最冷的学长，此刻耳根通红，却还是把书往你那边推了推','n2':'他蹲下去捡灌肠器，耳朵整个红了，手在抖','n3':'他撑得膝盖并紧，却先开口说"不可怕"','n4':'他连自己崩了都没反应过来，只觉得丢人','x1':'他把袋子递过来，你没接——他站在玄关，不知道该怎么办','x2':'他自己报了数字，报完才发现自己报得太顺','n5':'白天在图书馆把书摞得整整齐齐的人，此刻把手搭在阀门上等你发话','n6':'他站在镜子前，盯着自己被撑圆的肚子，眼眶一点点红起来','n7':'他学过的每一条操作规范都没教过他这种情况，于是他只剩一只手，死死抓着你','n8':'他整个人软在你怀里，第一次自己说了那句"我不想只是练习对象"'};
var FS_NODES={
n1:{place:'临川市图书馆 周四 16:20',lines:['闭架区，你第三次在同一个书架前遇到他。','「你也找这本？」他把书往你那边推了推，指节很干净。','♢你注意到他耳尖有点红，但他自己好像没发现。'],
 opts:[{t:'接过书，顺便看一眼借书卡上的名字',next:'n2',add:{dep:3}},{t:'摇头说"你拿吧"，退到旁边继续看',next:'n2',add:{shame:2}},{t:'笑着问他："这本，是给谁借的？"',next:'n2',add:{dep:5,own:2}}]},
n2:{place:'公寓 第一次试探',lines:['灌肠器从他手里掉下去，砸在地板上，声音很响。','他蹲下去捡，耳朵整个红了：「对不起……我查过资料，但真的是第一次动手。」','♢他说的是"我查过资料"。不是"我试着搜过"。','——','你其实也没比他好到哪里去。','你把那袋子拎起来的时候，手在抖，只是他没看见。你去厨房倒了两次水，第一次倒满了，又倒回去一半。','你告诉自己：先看，别急。今天不是非得灌。','♢你怕的从来不是他反悔。你怕的是自己收不住。'],
 opts:[{t:'蹲下来，跟他一起捡',next:'n3',add:{dep:5}},{t:'站着不动，看他捡',next:'n3',add:{own:4,shame:3}},{t:'把袋子放回柜子里："今天先不弄这个。"',next:'n3',add:{dep:8,own:3}}]},
n3:{place:'公寓浴室 第一次灌入',lines:['两百毫升。','管子进去的时候他没出声，只有膝盖并得很紧。水走得很慢，慢到你自己都能听见——不是水声，是他肚子里那种一阵一阵的、很轻的肠鸣。','到一百五，他的呼吸开始乱。到一百八，他的腰往下塌了半寸。到两百——你关阀的那一下，他整个人松了下来，像是终于允许自己喘一口气。','「……好像，没有我想的那么可怕。」他喘着看你。','你把手放上去。那层皮下面有一点很微弱的紧，是刚才那两百毫升撑出来的。皮肤是热的，有一点薄汗。','♢他第一句说的不是"疼"，是"不可怕"。'],
 opts:[{t:'再给他加一百',next:'n4',add:{belly:1,dep:4}},{t:'停手，先问他感觉',next:'n4',add:{dep:6}},{t:'把这一刻记进手账',next:'n4',add:{dep:3,shame:2}}]},
n4:{place:'公寓浴室 千毫升 · 首次崩溃',lines:['到一千的时候，他在没有任何触碰的情况下崩了。','整个人僵住，随后眼泪掉下来，一句话都说不出来。肚子撑出一个完整的弧度，皮肤绷得发亮，肚脐顶出来一小截。','♢他事后第一句是：「这个……能再试一次吗。」'],
 opts:[{t:'把他抱进怀里，什么都不说',next:'x1',add:{dep:8,own:3}},{t:'替他擦掉眼泪，告诉他"可以"',next:'x1',add:{dep:6}},{t:'让他自己缓，把这一刻记下来',next:'x1',add:{dep:3,shame:4}}]},
x1:{place:'公寓 周五 21:10 · 插章·第三次',lines:['你开门的时候，他已经站在门口了。浅灰家居服，手里拎着那只袋子，鼓的。','他把袋子递过来，眼睛看着你下巴：「今天……可以吗。」','你没接。你把它放到了鞋柜上，没打开。','「今天不灌。」','「……为什么。」','「因为我今天不想。你坐过来。」','——','你让他坐在沙发上，掌心按上他的小腹。那里是平的、软的、什么都没有，他却整个人绷紧了。','你把他下摆撩上去，让他把腰露出来。灯开着，那一圈皮肤干干净净，一点痕迹都没有，是他这一周养回来的。','他用两只手撑着沙发，把腰往下沉，往你手心里送。','♢他今天不是来被灌的。他是来被看着的。这两种他分得很清。','——','你只用手。不急，不用工具，不接任何东西。掌心贴着他的小腹，从右侧慢慢推到左边，再往下压，一路往深处按。','按到某个位置的时候，他倒吸了一口气，膝盖猛地往里合。','「这里？」','「……嗯。」','你又按了一下，同一处。「呜……」','他喉咙里那声很轻，但是真的。你看见他手背上的青筋起来了。','——','你才让他进浴室。水温三十六度五——他伸手试过，报了数，报完才意识到自己报得太顺，耳朵红了一下。','「两百。」','「太少了。」','「两百。今天从两百开始。」','水走得很慢，二百毫升用了四分钟。到两百，阀门关掉那一下，他整个人松了半寸。','「胀吗。」','「不胀。」','你把手放上去。那层皮下面有一点微弱的紧，肠鸣一阵一阵，很轻。','「不胀？」你说，「那你这里在响什么。」','他没说话，耳尖红透了。','——','两百，停。四百，停。中间你让他自己说。第二次他说「再加两百」，第三次他说「五百」，说完自己顿了一下。','累计一千三。小腹鼓起来一个圆润的弧，从肋骨下面撑开往下坠。皮肤绷起来，摸上去是紧的、滑的。腰两侧的线条软了。','他的腿开始发抖。你去按他的肚脐——已经微微翻出来一点了。','「疼吗。」','「……酸。腰酸。」','你让他翻身。他撑着床的时候，一口气没憋住，从齿缝漏出来一声。很短。但他自己听见了，立刻咬住嘴唇。','♢这是他今天第一次没压住。','——','他把手伸过来，抓住你的手腕：「……再来。」','你没动。「你今天不行。」','「我可以。」','「我说不行。」','他盯着你看，眼睛有点红，但没哭。那个眼神很倔——不是求饶，是不服气。','你把手从他肚子上拿开了。他的呼吸整个乱了。','「……林晚。」','「明天。明天你要是还想要，我就给你加。今天到这儿。」','他把脸别过去，别了很久，最后转回来，很轻地说了两个字：「好。」'],
 opts:[{t:'说到做到：明天给他加量',next:'x2',add:{dep:6,own:4}},{t:'明天也不给满，继续吊着',next:'x2',add:{own:8,shame:4}},{t:'今晚不灌，但让他含着堵着睡',next:'x2',add:{dep:8,obey:5}}]},
x2:{place:'公寓 周六 20:00 · 插章·明天',lines:['他一整天只发了一条消息：「几点。」','你回了三个字：「别急。等。」然后就没再回。','他七点四十到的，比昨天早了二十分钟。衬衫袖口卷了两道，是他自己没注意。','「今天……今天加多少。」','「你自己说。」','他想了想：「一千五。」','你没接话，只是看他。他抿了下嘴，改口：「……一千八。」','「进来。」','——','「你自己报的，你自己认。」今天你没吊他，灌得比昨天快。','五百毫升：肠鸣先来了，密集的、一阵接一阵，隔着皮都能听见。他膝盖往里合，又自己掰开。','「绞痛吗。」','「不绞。」','「你手指在抓浴缸边。」','他低头看了一眼自己的手，指节是白的。他把手挪开，又重新放回去。「……有一点。」','一千毫升：下坠感起来了。小腹那个弧一点点圆起来，撑开往下沉。他呼吸的时候弧度跟着抬，落下去的时候就要闷一声。','皮肤绷住了。腰两侧那条线已经软掉。「腰。」他说。「哪。」「后面。酸。」','一千八百毫升：他的肚子已经是一个完整的孕肚弧线——圆、饱满、往下垂，皮肤绷得发亮，能看见细细的血管。肚脐翻出来一小截，顶在最高点上。','腿在抖，膝盖一下一下往里碰。他自己的手一直搁在肚子上——不是护着，是捧着。','「把腿放平。」他放平了。肚子的形状立刻变了一个样，更凸、更沉，几乎要自己往两边摊开。「啊……」','「出声了。」','「……对不起。」','「不用对不起。今天你可以出声。」','他愣了一秒，眼眶红了。','♢你昨天不让他出声，今天允许了。他大概第一次明白，"给不给"是你的权限，不是他的容量。','——','你把他扶起来让他站。他撑墙，膝盖打直了又软下去。走两步就要停一停，一只手托着肚子。','「走三步。」','「……为什么。」','「因为你今天有点飘。」','第三步落下的时候他顺着墙滑下去，被你一把捞住。睫毛是湿的。但他说：「我没说停。」','——','排空用了二十多分钟。他躺着，肚子一点点回落，皮肤上留着一圈被撑开过的浅痕。','你给他擦汗、揉腰、喂了半杯水。快睡着的时候，他忽然开口。','「林晚。」','「嗯。」','「你昨天不给我，今天又给了。我一直在想哪个才是真的。」','「都是真的。」','「那明天呢。」','你没回答。他自己接了下去，声音很小，但很清楚：','「那明天……让我自己来。」'],
 opts:[{t:'答应他：明天你自己准备，我只看着',next:'n5',add:{dep:8,own:5}},{t:'不答应，再压他一天',next:'n5',add:{own:10,shame:5}},{t:'答应，但条件是他报的数字翻倍',next:'n5',add:{obey:8,dep:6}}]},
n5:{place:'公寓浴室 他自己准备的那晚',lines:['「让我自己来。」他是这么说的。','门没锁。浴巾、指套、润滑剂、灌肠袋，全按你会用的顺序摆好，袋子里已经装了一千五。','「这次我想自己来。」他坐在浴缸边，「你只看。哪里不对你就说。」','♢他想让你看见，他愿意为这件事提前一小时把自己收拾干净。'],
 opts:[{t:'抱手靠在门框上："那开始吧。"',next:'n6',add:{dep:6,obey:5}},{t:'走过去，先亲一下他的耳尖',next:'n6',add:{dep:8,own:3}},{t:'检查一遍他准备的东西',next:'n6',add:{dep:4,obey:3}}]},
n6:{place:'公寓浴室镜前',lines:['你把他扶到镜子前，手按在他肩上。','镜子里那个人，短袖被撑成不规则的形状，下摆翘起来，肚脐顶出一小截，腰线没了。','他第一反应想侧身躲。你按住他：「看。」','「……看到了。很难看。」','「不难看。很好看。」'],
 opts:[{t:'让他再多看一会儿',next:'n7',add:{shame:6,dep:4}},{t:'把他转过来，面对你',next:'n7',add:{dep:6,own:4}},{t:'把他此刻的样子记进手账',next:'n7',add:{shame:4,dep:3}}]},
n7:{place:'公寓卧室 束腹加压',lines:['他自己从床头柜里拿出束腹带，递给你——不是你带来的，是他买的。','「你今晚别总替我刹车。」他说。','你替他缠上。搭扣一格一格扣紧，那点弧度被强行压平成一个规整的硬弧。他倒抽一口气，膝盖弯得更厉害。','——','你没让他躺下。','「起来，走两步。」','他扶着你站起来。束腹带把水堵在里面，他每走一步都要停一停，手掌按着腰侧，指节发白。走到第二圈，他忽然闷哼了一声，整个人往前弓，被你一把扶住。','「怎么了。」','「……束腹带下面那一格，」他喘着说，「勒进去了。」','你低头看——腰腹侧面确实被勒出一圈浅红的印。可他抓着你的手，没松。','「还要走吗。」你问。','「走。」他说，「你让我走的。」','——','回到床上，他咬着嘴唇不出声，最后漏出一声，然后求你：「再一点……求你了。」','那不是求停。是求别停。','♢这一刻你应该明白，你们之间那个位置，早就不是"你灌他受"了。'],
 opts:[{t:'给他放两百，然后自己关阀',next:'n8',add:{belly:2,dep:7,obey:5}},{t:'不同意，直接解开束腹带',next:'n8',add:{dep:9,own:2}},{t:'停下，问他界限在哪',next:'n8',add:{dep:6,obey:3}}]},
n8:{place:'公寓浴室 排空 · 事后照顾',lines:['他靠在你身上，肚子从那个高度慢慢回落。','擦到勒痕的时候他抖了一下：「不是疼……你手一碰，我就想哭。」','洗完你把他按在床上，从背后抱着，掌心一遍遍揉他刚回落的肚子。','「林晚。」他忽然开口，「我不想只是……练习对象。」','「我不知道你想把我放在哪。但我想先告诉你我在哪。」'],
 opts:[{t:'A · 独占：「你是我一个人的。」',next:'a1',add:{own:10,dep:8}},{t:'B · 圈内伴侣：带他一起认识深水区',next:'b1',add:{dep:8,own:4}},{t:'C · 继续极限：先不谈关系，往下推',next:'c1',add:{obey:8,dep:4}}]},
a1:{place:'结局 A · 公寓卧室 凌晨 00:20',lines:['「你是我一个人的。」','他没说好。他只是把脸埋进你肩膀里，抱得更紧。','过了很久，他才闷闷开口：「那你……能不能别再加别人。」','「为什么。」','「我也不知道。你灌我的时候我在想，如果今天床上躺的是别人，我大概会想死。」','♢他把最难堪的那句说出来了。说完自己耳朵又红了。'],
 opts:[{t:'「不会。就你一个。」',next:'a2',add:{dep:8,own:6}},{t:'「你先把论坛账号退了，再说这句。」',next:'a2',add:{obey:8,own:4}},{t:'什么都不说，把他搂得更紧',next:'a2',add:{dep:6,own:5}}]},
a2:{place:'第二天 傍晚 客厅',lines:['他当着你的面注销了那个匿名账号。手指在屏幕上停了三秒才按下去。','然后他从包里拿出一本手账。写满的。','第一页是你第一次让他来的日期。往后每一页：日期、毫升、肚围、他说了什么、你做了什么。','「以前是给我自己记的。」他把本子推过来，「现在想交给你。」','最后一页是空白的。「这页留着。」他说，「等我们下一次。」'],
 opts:[{t:'收下手账，写上一个日期',next:'aEnd',add:{dep:6,own:6}},{t:'让他自己写完最后一页',next:'aEnd',add:{dep:8}},{t:'把手账合上，先抱他一会儿',next:'aEnd',add:{dep:7,own:4}}]},
aEnd:{place:'结局 · 独占',lines:['那晚他没走。之后很多个晚上他都没走。','牙刷在你浴室里，教材在你书桌上，浅灰家居服挂在你衣柜最右边那一格。','手账放在床头，一页一页往下填。','♢你们之间从来不是"你灌他受"。是你把他收进你的夜里，而他愿意留下来。','—— 完结 · 独占结局'],
 opts:[{t:'🔁 重新走一遍（保留手账）',next:'n1',reset:true},{t:'🏠 返回开始界面',home:true}]},
b1:{place:'城西私人酒吧 周六 22:00',lines:['周林在吧台后擦杯子，抬头看见你们进来，笑了一下。','「带人来了。」','沈屿站在你身边，手插在口袋里，很安静。但你注意到他在数人头。','「怕？」你低声问。','「不是。」他说，「我在想，这里有多少人跟我一样。」','周林把两杯酒推过来。「不多。也不少。」'],
 opts:[{t:'牵住他的手，从头到尾不松',next:'b2',add:{dep:7,own:5}},{t:'松开手，让他自己去跟人搭话',next:'b2',add:{dep:5,obey:6}},{t:'直接带他去后面的房间',next:'b2',add:{own:6,obey:4}}]},
b2:{place:'酒吧后场 23:10',lines:['有人过来搭话，眼睛在沈屿身上转了一圈，问他是哪个科的。','「医学生。」他答得很规矩。','那人笑：「第一次来吧。」','他没接话。你看见他手指在裤缝上攥了一下。','你把手伸过去，他几乎是立刻握住了。','♢他在别人面前不需要被保护，但他需要知道你站在哪儿。'],
 opts:[{t:'当着那个人的面，把手扣紧',next:'bEnd',add:{own:7,dep:6}},{t:'替他回答："他跟我一起。"',next:'bEnd',add:{dep:7,own:5}},{t:'什么都不说，拉着他往外走',next:'bEnd',add:{dep:6}}]},
bEnd:{place:'结局 · 圈内伴侣',lines:['后来你们成了这儿的熟面孔。','他不再躲在门口，会主动跟周林点头，会翻别人的手账，也把自己的写给人看。','那天他填完最后一栏，把笔递过来：「你签个名吧。」','「签什么。」','「证明这是我的。」他顿了顿，「也证明我是你的。」','—— 完结 · 圈内伴侣结局'],
 opts:[{t:'🔁 重新走一遍（保留手账）',next:'n1',reset:true},{t:'🏠 返回开始界面',home:true}]},
c1:{place:'公寓浴室 深夜',lines:['「你答应过我的，」他看着你，「别替我刹车。」','你在他身上花了三个小时。五千，六千。','灌肠袋换成最大的那只，软管换成更粗的一根。','他跪趴在垫子上，肚子垂下来，圆得几乎贴不住地面。皮肤绷得发亮，细小的血管都能看见，肚脐翻出来一整圈。','他喘得很重，每一次呼吸腰都在抖。','「多少了。」','「六千四。」','「再来。」'],
 opts:[{t:'再给他加五百',next:'c2',add:{belly:3,obey:8,dep:5}},{t:'停下，先让他缓十分钟',next:'c2',add:{dep:8}},{t:'换到镜前，让他自己看着',next:'c2',add:{shame:8,dep:6}}]},

function startFixed(fresh){
  if(fresh!==false&&localStorage.getItem('snn_fixed_save_v1')){
    if(confirm('检测到固定线存档。\n点"确定"＝继续上次进度\n点"取消"＝从图书馆重开'))fresh=false;
  }
  if(fresh===false&&localStorage.getItem('snn_fixed_save_v1'))resumeFixed();else newFixedGame();
}
function newFixedGame(){
  MODE='fixed';document.getElementById('startOverlay').style.display='none';document.getElementById('app').style.display='flex';
  FS={node:'n1',dep:0,shame:0,own:0,obey:0,belly:0,total:0,logs:[]};logList=[];
  document.getElementById('chat').innerHTML='';document.getElementById('topTitle').textContent='固定线 · 沈屿·林晚';
  addMsg('sys','📖 固定故事线 · 沈屿 · 林晚');fixedSave(true);fixedGo('n1');setTimeout(scrollBottom,60);
}
function resumeFixed(){
  var s=localStorage.getItem('snn_fixed_save_v1');if(!s){newFixedGame();return;}
  MODE='fixed';document.getElementById('startOverlay').style.display='none';document.getElementById('app').style.display='flex';
  try{var o=JSON.parse(s);FS=o.fs;FS.logs=o.logs||[];document.getElementById('chat').innerHTML='';document.getElementById('topTitle').textContent='固定线 · 沈屿·林晚';addMsg('sys','▶️ 已继续上次进度');fixedGo(FS.node||'n1');}catch(e){newFixedGame();}
  setTimeout(scrollBottom,60);
}
function fixedGo(id){
  var n=FS_NODES[id];if(!n)return;
  FS.node=id;addMsg('sys','□ '+n.place);
  n.lines.forEach(function(L){
    if(L.indexOf('♢')===0)addMsg('inner',L.slice(1));
    else if(L.charAt(0)==='「')addMsg('him',L,'屿');
    else if(L==='——')addMsg('sys','────────');
    else addMsg('nar',L);
  });
  addMsg('sys','────────');
  showOpts(n.opts.map(function(o){return {t:o.t,fn:function(){fixedPick(o);}};}));
  try{updateStatus();}catch(e){}
}
function fixedPick(o){
  if(o.add){for(var k in o.add)FS[k]=(FS[k]||0)+o.add[k];}
  if(o.reset){FS.belly=0;FS.dep=0;FS.shame=0;FS.own=0;FS.obey=0;FS.total=0;}
  if(FS.logs.length<60){FS.logs.push({turn:FS.logs.length+1,male:'沈屿',text:o.t,role:FROLE[FS.node]||'他靠在你身边，什么都没说',belly:FS.belly,dep:FS.dep,shame:FS.shame});addMsg('sys','📓 手账：'+o.t+'（'+(FROLE[FS.node]||'')+'）');}
  fixedSave(true);
  if(o.home){uiHome();return;}
  if(o.next==='aEnd')ACH.eA=1;if(o.next==='bEnd')ACH.eB=1;if(o.next==='cEnd')ACH.eC=1;
  setTimeout(function(){fixedGo(o.next);},160);
}
function fixedSave(silent){try{localStorage.setItem('snn_fixed_save_v1',JSON.stringify({fs:FS,logs:FS.logs.slice(-5)}));if(!silent)toast('💾 固定线已存档');}catch(e){}}

refreshStart();
document.getElementById('chat').addEventListener('scroll',function(){
  var j=document.getElementById('jumpBtn');if(!j)return;
  if(AUTO_SCROLL){j.style.display='none';return;}
  j.style.display=nearBottom()?'none':'block';
});
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
